name = "newchat"
main = "worker/index.ts"
compatibility_date = "2026-11-08"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
ALLOWED_ORIGIN = "https://newchat.shqiptare.workers.dev"
SUPABASE_URL = "https://saavqlbwffrwxingbnri.supabase.co"
SUPABASE_ANON_KEY = "sb_publishable_IruAYNoelmN7N4Q1Hy2HFg_wxw-1zgS"

[secrets]
required = ["OPENROUTER_API_KEY"]

[[workflows]]
name = "newchat-agent"
binding = "AGENT_WORKFLOW"
class_name = "AgentWorkflow"

[[containers]]
class_name = "AgentSandbox"
scheduling_policy = "durable_object"
instance_type = "lite"
max_instances = 10

[[durable_objects.bindings]]
name = "AGENT_SANDBOX"
class_name = "AgentSandbox"

[containers.images.workspace]
dockerfile = "./Dockerfile"

[exports.AgentSandbox]
type = "durable-object"
storage = "sqlite"
