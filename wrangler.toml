name = "newchat"
main = "worker/index.ts"
compatibility_date = "2026-11-08"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
ALLOWED_ORIGIN = "https://newchat.shqiptare.workers.dev"
GITHUB_SANDBOX_REPOSITORY = "fadiu007-creator/Newchat"
SUPABASE_URL = "https://saavqlbwffrwxingbnri.supabase.co"
SUPABASE_ANON_KEY = "sb_publishable_IruAYNoelmN7N4Q1Hy2HFg_wxw-1zgS"

[secrets]
required = [
  "OPENROUTER_API_KEY",
  "SUPABASE_SERVICE_ROLE_KEY",
  "GITHUB_APP_ID",
  "GITHUB_APP_PRIVATE_KEY",
  "GITHUB_APP_INSTALLATION_ID"
]

[[workflows]]
name = "newchat-agent"
binding = "AGENT_WORKFLOW"
class_name = "AgentWorkflow"

[workflows.default_retention]
success_retention = "3 days"
error_retention = "3 days"

