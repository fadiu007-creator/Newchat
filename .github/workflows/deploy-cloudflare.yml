name: Cloudflare deployment and independent verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Deploy to Cloudflare Workers Free-compatible runtime
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          npx wrangler deploy --var APP_COMMIT_SHA:${GITHUB_SHA}
      - name: Verify the live deployment independently
        env:
          EXPECTED_SHA: ${{ github.sha }}
          HEALTH_URL: https://newchat.shqiptare.workers.dev/api/health
        run: |
          node --input-type=module <<'NODE'
          const required = ["chat", "agentPlanning", "agentExecution", "sandboxExecution", "githubOperations", "independentGithubVerification", "paidModelApproval"];
          const deadline = Date.now() + 120_000;
          let lastHealth = null;
          let lastError = null;
          while (Date.now() < deadline) {
            try {
              const response = await fetch(process.env.HEALTH_URL, { cache: "no-store" });
              if (!response.ok) throw new Error(`Health endpoint returned HTTP ${response.status}`);
              const health = await response.json();
              lastHealth = health;
              if (health.build_sha !== process.env.EXPECTED_SHA) {
                lastError = new Error(`Live build SHA mismatch: expected ${process.env.EXPECTED_SHA}, got ${health.build_sha}`);
              } else if (health.ok !== true) {
                lastError = new Error("Health endpoint did not report ok=true.");
              } else {
                const missing = required.filter(name => health.capabilities?.[name] !== true);
                if (missing.length === 0) {
                  console.log("Verified live deployment SHA and required runtime capabilities:", health.build_sha);
                  process.exit(0);
                }
                lastError = new Error("Production Worker is not ready; missing capabilities: " + missing.join(", "));
              }
            } catch (error) {
              lastError = error;
            }
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          console.error("Independent production verification timed out.", {
            expected_sha: process.env.EXPECTED_SHA,
            last_health: lastHealth,
            last_error: String(lastError)
          });
          process.exit(1);
          NODE
