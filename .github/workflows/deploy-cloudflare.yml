name: Cloudflare deployment and independent verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Deploy to Cloudflare Workers Free-compatible runtime
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_SHA: ${{ github.sha }}
        run: npx wrangler deploy --var APP_COMMIT_SHA:${GITHUB_SHA}
      - name: Verify the live deployment independently
        env:
          EXPECTED_SHA: ${{ github.sha }}
          HEALTH_URL: https://newchat.shqiptare.workers.dev/api/health
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 24 --retry-delay 5 --retry-connrefused "$HEALTH_URL" -o /tmp/newchat-health.json
          node --input-type=module -e '
            import fs from "node:fs";
            const health = JSON.parse(fs.readFileSync("/tmp/newchat-health.json", "utf8"));
            if (health.build_sha !== process.env.EXPECTED_SHA) {
              console.error("Live build SHA mismatch", { expected: process.env.EXPECTED_SHA, actual: health.build_sha });
              process.exit(1);
            }
            if (health.ok !== true) throw new Error("Health endpoint did not report ok=true.");
            console.log("Verified live deployment SHA:", health.build_sha);
          '
