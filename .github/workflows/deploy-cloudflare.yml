name: Cloudflare deployment and independent verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Prepare and validate persistent Worker secrets
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EDENAI_API_KEY: ${{ secrets.EDENAI_API_KEY }}
          GITHUB_APP_TOKEN: ${{ secrets.NEWCHAT_GITHUB_TOKEN }}
          GITHUB_APP_ID: ${{ secrets.NEWCHAT_GITHUB_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.NEWCHAT_GITHUB_APP_PRIVATE_KEY }}
          GITHUB_APP_INSTALLATION_ID: ${{ secrets.NEWCHAT_GITHUB_APP_INSTALLATION_ID }}
          GITHUB_ALLOWED_REPOSITORIES: ${{ secrets.NEWCHAT_GITHUB_ALLOWED_REPOSITORIES }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const required = ["OPENROUTER_API_KEY", "SUPABASE_SERVICE_ROLE_KEY"];
          const missing = required.filter(name => !process.env[name]?.trim());
          const hasGithubToken = Boolean(process.env.GITHUB_APP_TOKEN?.trim());
          const hasGithubApp = ["GITHUB_APP_ID", "GITHUB_APP_PRIVATE_KEY", "GITHUB_APP_INSTALLATION_ID"]
            .every(name => Boolean(process.env[name]?.trim()));
          if (!hasGithubToken && !hasGithubApp) missing.push("GITHUB_APP_TOKEN or the complete GitHub App credential set");
          if (missing.length) {
            console.error("Required Cloudflare secrets are missing from GitHub Actions secrets:", missing.join(", "));
            process.exit(1);
          }
          const names = [
            "OPENROUTER_API_KEY", "SUPABASE_SERVICE_ROLE_KEY", "EDENAI_API_KEY",
            "GITHUB_APP_TOKEN", "GITHUB_APP_ID", "GITHUB_APP_PRIVATE_KEY",
            "GITHUB_APP_INSTALLATION_ID", "GITHUB_ALLOWED_REPOSITORIES"
          ];
          const payload = Object.fromEntries(names
            .filter(name => Boolean(process.env[name]?.trim()))
            .map(name => [name, process.env[name]]));
          fs.writeFileSync("/tmp/newchat-secrets.json", JSON.stringify(payload), { mode: 0o600 });
          console.log("Validated and prepared", Object.keys(payload).length, "Worker secrets without printing values.");
          NODE
      - name: Deploy application to Cloudflare Workers Free-compatible runtime
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          npx wrangler deploy --var APP_COMMIT_SHA:${GITHUB_SHA}
      - name: Restore Worker secrets from protected GitHub Actions secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler secret bulk /tmp/newchat-secrets.json
          rm -f /tmp/newchat-secrets.json
      - name: Verify the live deployment independently
        env:
          EXPECTED_SHA: ${{ github.sha }}
          HEALTH_URL: https://newchat.shqiptare.workers.dev/api/health
        run: |
          node --input-type=module <<'NODE'
          const required = ["chat", "agentPlanning", "agentExecution", "sandboxExecution", "githubOperations", "independentGithubVerification", "paidModelApproval"];
          const requiredConfiguration = ["github", "supabase", "openrouter", "edenai"];
          const deadline = Date.now() + 120_000;
          let lastHealth = null;
          let lastError = null;
          while (Date.now() < deadline) {
            try {
              const response = await fetch(process.env.HEALTH_URL, { cache: "no-store" });
              if (!response.ok) throw new Error(`Health endpoint returned HTTP ${response.status}`);
              const health = await response.json();
              lastHealth = health;
              if (health.build_sha !== process.env.EXPECTED_SHA) {
                lastError = new Error(`Live build SHA mismatch: expected ${process.env.EXPECTED_SHA}, got ${health.build_sha}`);
              } else if (health.ok !== true) {
                lastError = new Error("Health endpoint did not report ok=true.");
              } else {
                const missingCapabilities = required.filter(name => health.capabilities?.[name] !== true);
                const missingConfiguration = requiredConfiguration.filter(name => health.configuration?.[name] !== true);
                if (missingCapabilities.length === 0 && missingConfiguration.length === 0) {
                  console.log("Verified live deployment SHA, runtime capabilities, and provider configuration:", health.build_sha);
                  process.exit(0);
                }
                lastError = new Error("Production Worker is not ready; missing capabilities: " + missingCapabilities.join(", ") + "; missing configuration: " + missingConfiguration.join(", "));
              }
            } catch (error) {
              lastError = error;
            }
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          console.error("Independent production verification timed out.", {
            expected_sha: process.env.EXPECTED_SHA,
            last_health: lastHealth,
            last_error: String(lastError)
          });
          process.exit(1);
          NODE
